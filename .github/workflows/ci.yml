name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Translations (every language file has all keys of en.json)
        run: npm run check:i18n
      - name: Builds (crazygames, web, gd, gamepix, playgama)
        run: npm run build:all
      - name: Build size budget (< 4 MB each)
        run: npm run check:size
      - name: Each portal's SDK only in its own build
        run: |
          ! grep -rqi "sdk.crazygames.com" dist-web dist-gd dist-gamepix dist-playgama dist-gamemonetize dist-y8
          ! grep -rqi "gamedistribution.com" dist dist-web dist-gamepix dist-playgama dist-gamemonetize dist-y8
          ! grep -rqi "gamepix.sdk.js" dist dist-web dist-gd dist-playgama dist-gamemonetize dist-y8
          ! grep -rqi "playgama-bridge" dist dist-web dist-gd dist-gamepix dist-gamemonetize dist-y8
          ! grep -rqi "api.gamemonetize.com" dist dist-web dist-gd dist-gamepix dist-playgama dist-y8
          ! grep -rqi "cdn.y8.com" dist dist-web dist-gd dist-gamepix dist-playgama dist-gamemonetize
          grep -rq "tnwpox2a6ymzt6ljyslvspxnstv85tjd" dist-gamemonetize/assets
          grep -rq "6af5b5e97eafcdc5d5ddce9c" dist-y8/assets && grep -rq "292717" dist-y8/assets
      - name: GameDistribution build carries GD_OPTIONS, the SDK and the real game ID
        run: npm run check:gd
      - name: GamePix bundle assigns the legacy soundOn / soundOff / pause / resume handlers, listens with events.on and reads GamePix.lang()
        run: |
          cat dist-gamepix/assets/*.js > "$RUNNER_TEMP/gpx.js"
          for re in 'GamePix\.soundOff\s*=[^=]' 'GamePix\.soundOn\s*=[^=]' 'GamePix\.pause\s*=[^=]' 'GamePix\.resume\s*=[^=]' 'events\.on\(' 'GamePix\.lang\(\)'; do
            grep -qE "$re" "$RUNNER_TEMP/gpx.js" || { echo "::error::GamePix bundle has no match for $re"; exit 1; }
          done
      - name: Submission folders (zips, index.html at the root, own SDK only, store texts, art sizes)
        run: npm run submission:check

  levels:
    # the level validator: the human-limited playtester (only a finger's inputs, every press checked 0.1 s early /
    # late and with a shorter / longer hold, 0.25 s reaction time) plays all 95 shipped levels with the real physics
    # at their real speed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Level validator (the human-limited player beats every level with all 3 acorns, losing no heart, within its seeds at its real speed; wrong plants fail; every hazard on screen >= 1 s; writes docs/levels-report.md)
        run: npm run validate:levels
      - name: Level validator report is up to date
        run: git diff --exit-code docs/levels-report.md

  playtest:
    # the full playtest: the human-limited playtester plays every level (with death probes: a fall or the crocodile
    # costs exactly one heart), then every level is played once more in the real web build on a desktop viewport
    # with the keyboard and a phone viewport with touch (HUD, camera view ahead, end screen, finger lift, page errors)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install Chromium for Playwright (system packages best-effort, the runner image already has Chromium's libraries)"
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::apt mirror unreachable, using the runner image's system libraries"
      - name: Human-limited playtest, simulation (all 95 levels, death probes)
        run: npm run playtest -- --tag=ci
      - run: npm run build:web
      - name: Browser playtest (all 95 levels, desktop keyboard + phone touch, real input path)
        run: npm run playtest:browser -- --tag=ci --no-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest
          path: |
            playtest-out/*.json
            playtest-out/*.log

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install Chromium for Playwright (system packages best-effort, the runner image already has Chromium's libraries)"
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::apt mirror unreachable, using the runner image's system libraries"

      - run: npm run build:web
      - run: npm run test:e2e

  crash:
    # zero errors (docs/robustness.md): nothing uncaught, no unhandled rejection, no console error, loading always
    # reaches loadingStop, the game never waits forever or stays paused — first load, several levels, every ad
    # outcome, tab hide / show, resize / rotate, failed downloads, private mode, old saves, no WebGL, context loss.
    # Every engine, desktop + phone.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install ${{ matrix.engine }} for Playwright (system packages best-effort if the Ubuntu apt mirror is down)"
        run: |
          npx playwright install ${{ matrix.engine }}
          npx playwright install-deps ${{ matrix.engine }} || echo "::warning::apt mirror unreachable, using the runner image's system libraries"
      - run: npm run build
      - name: Zero errors (${{ matrix.engine }}, desktop + phone)
        run: xvfb-run -a npx playwright test -c playwright.crash.config.ts --project "${{ matrix.engine }}-*" --trace off

  portals:
    # GameMonetize, Y8 and GameDistribution builds with stubbed SDKs: init exactly as documented, ads only at the allowed breaks, every
    # ad settles, rewarded only after the ad was watched (Y8; none on GameMonetize), pause + mute, ad blocker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install Chromium for Playwright (system packages best-effort, the runner image already has Chromium's libraries)"
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::apt mirror unreachable, using the runner image's system libraries"
      - run: npm run build:gamemonetize && npm run build:y8 && npm run build:gd
      - name: GameMonetize + Y8 + GameDistribution smoke tests
        run: npx playwright test -c playwright.portals.config.ts --trace off

  web:
    # open portals (itch.io, Newgrounds, ...): the ad-free web build as a zip with index.html at the root
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install Chromium for Playwright (system packages best-effort, the runner image already has Chromium's libraries)"
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::apt mirror unreachable, using the runner image's system libraries"

      - name: Web build + zip
        run: npm run build:web && node scripts/web/zip.mjs ci-web/sprout-trail-web.zip
      - name: Web zip checks (index.html at the root, no portal SDK / ads, no external request, iframe 640x480 / 960x600 / 1280x720 / 390x844, level 1-1 played)
        run: node scripts/web/check.mjs ci-web/sprout-trail-web.zip --shots ci-web/checks
      - name: Committed zip passes the same file checks
        run: node scripts/web/check.mjs "$(ls submission-web/sprout-trail-web-v*.zip | sort -V | tail -1)" --static
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-zip-checks
          path: ci-web/

  playgama:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: "Install Chromium for Playwright (system packages best-effort, the runner image already has Chromium's libraries)"
        run: |
          npx playwright install chromium
          npx playwright install-deps chromium || echo "::warning::apt mirror unreachable, using the runner image's system libraries"

      - name: Playgama build
        run: npm run build:playgama
      - name: Playgama zip checks (index.html at the root, Bridge first in <head>, pinned Bridge build, no other portal, Playgama's precheck)
        run: node scripts/playgama/zip.mjs ci-playgama/sprout-trail-playgama.zip && node scripts/playgama/check.mjs ci-playgama/sprout-trail-playgama.zip
      - name: Committed zip passes the same checks
        run: node scripts/playgama/check.mjs "$(ls submission-playgama/sprout-trail-playgama-v*.zip | sort -V | tail -1)"
      - name: Bridge test (mock platform + stubbed Playgama SDK; interstitial, rewarded completed / cancelled, muted during ads)
        run: node scripts/playgama/test.mjs ci-playgama/sprout-trail-playgama.zip
